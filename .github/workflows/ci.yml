# Prüfung bei jedem Push und Pull Request.
#
# Die Actions sind auf einen Commit-Hash festgelegt, der Tag steht als Kommentar
# dahinter. Warum: Lernpfad Sicherheit, Schritt 07 «Die Lieferkette».
name: CI

on:
  push:
  pull_request:

# Der automatische GITHUB_TOKEN darf hier nur lesen.
permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Übungen prüfen (Lösungen bestehen, Vorlagen noch nicht)
        run: python -m pytest -q tests
      - name: Seite bauen (ohne Python für den Browser)
        run: python bauen.py --ohne-python
      - name: Workflows prüfen (eigene Übung aus Schritt 07)
        run: |
          python - <<'EOF'
          import sys, pathlib
          sys.path.insert(0, "inhalte/sicherheit/07-lieferkette")
          from loesung import riskant
          funde = {str(p): riskant(p.read_text()) for p in pathlib.Path(".github/workflows").glob("*.yml")}
          funde = {k: v for k, v in funde.items() if v}
          if funde:
              print("Nicht festgelegte Actions:", funde)
              sys.exit(1)
          print("Alle Actions auf einen Commit festgelegt.")
          EOF

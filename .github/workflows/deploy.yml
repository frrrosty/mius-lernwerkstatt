# Auslieferung auf Hostpoint per SSH und rsync.
#
# Läuft nur von Hand (Actions → «Deploy» → Run workflow), nie automatisch.
# So entscheidest du, wann etwas live geht. Einrichtung: docs/einrichten.md
#
# Benötigte Secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST          Hostname des Servers
#   SSH_USER          Benutzername bei Hostpoint
#   SSH_PRIVATE_KEY   privater Deploy-Schlüssel (ed25519, ohne Passphrase)
#   SSH_KNOWN_HOSTS   die known_hosts-Zeile des Servers, geprüft (siehe Anleitung)
#   SSH_TARGET_DIR    Webordner der Subdomain auf dem Server
#   HTPASSWD_PFAD     Pfad der Passwortdatei, ausserhalb des Webordners
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ausliefern:
    runs-on: ubuntu-latest
    environment: produktion
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Übungen prüfen
        run: python -m pytest -q tests
      - name: Seite bauen, Pyodide mit Prüfsumme
        run: python bauen.py
      - name: Zugangsschutz eintragen
        env:
          HTPASSWD_PFAD: ${{ secrets.HTPASSWD_PFAD }}
        run: |
          test -n "$HTPASSWD_PFAD" || { echo "Secret HTPASSWD_PFAD fehlt"; exit 1; }
          sed -i "s|__HTPASSWD_PFAD__|$HTPASSWD_PFAD|" dist/.htaccess
          grep -q "AuthUserFile /" dist/.htaccess
      - name: SSH vorbereiten
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # Fester Fingerabdruck statt ssh-keyscan: Sonst würde jeder Server akzeptiert,
          # der sich unterwegs als Hostpoint ausgibt.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
      - name: Hochladen
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          # MACs=hmac-sha2-512: ohne das bricht Hostpoint je nach Client mit
          # «Corrupted MAC on input» ab (Erfahrung aus dem PräsenzTool).
          rsync -rlptz --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o MACs=hmac-sha2-512" \
            dist/ "$SSH_USER@$SSH_HOST:$SSH_TARGET_DIR/"
      - name: Schlüssel entfernen
        if: always()
        run: rm -f ~/.ssh/deploy
